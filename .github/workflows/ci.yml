name: CI

# A branch is checked by its pull request; a push runs CI only on main (the merge run). Before,
# every commit of a PR ran twice, once per event (Vojmapo, 37442271925 and 37442276408).
# That double run was also the only repetition on one tree, and it showed the hook timeout in
# ak09-dialog.test.ts (red in the push run, green in the PR run). The nightly full run on main keeps
# a repetition without doubling every commit; workflow_dispatch repeats a tree on demand.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# No network beyond `pnpm install`: keep Turborepo telemetry off.
env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

# Spec 040 T-5: every job keeps the local Turborepo cache (.turbo/cache) between runs, one cache
# per job and matrix value, and builds only what its steps need (`turbo run build --filter`). The
# key ends on the commit, so every run saves; a run restores the newest cache of its job through
# the prefix of lockfile, turbo.json and Node. Turborepo hashes the inputs of every task itself
# (turbo.json, packages/modelo/src/ci/turbo-inputs.test.ts): a hit replays only what is unchanged.
# No remote cache, no token.

# The event is part of the group: the nightly run and a merge run share refs/heads/main and must not
# cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Nachlese 3 W1 (Spec 011 ⑤ B-9, O-21 fortgesetzt): three jobs side by side instead of one row.
  # The one job ran the Playwright suite of the Eroj beside the spawning e2e files of modelo
  # (turbo runs the packages' tests in parallel): the hook of validate.test.ts timed out under
  # that load (run 38966614433), and the wall clock stood at 16 to 19 minutes. Measured
  # before/after in specs/012-nachlese-3/plan.md ②.
  #
  # Spec 015 ② (O-4 of plan ①, B-12): the job of the unit tests grew with every Ero past the
  # 12-minute line (run 39126240312: 12 min 07 s, its Test step 10 min 24 s; the Projekcioj suite
  # took 622 s of it beside modelo, cli and mcp on the four cores of the runner). It is cut in
  # three: the checks (build, perf, lint, the Modelo checks, release — about two minutes), the
  # unit tests of every package but Projekcioj and Eroj, and the Projekcioj suite in two Vitest
  # shards, the cut the Eroj got with W1. Measured before/after in specs/015-eroj-runde-4/plan.md ②.
  checks:
    name: Build, lint and Modelo checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Default fetch depth (1) is enough: the checks only need `git ls-files`.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm version comes from `packageManager` in package.json; no `version` input.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # pnpm must be installed first so setup-node can resolve the pnpm store for caching.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-

      # Spec 040 T-5 (A-5): the checks need every package – lint builds the dependencies of each,
      # check:parity runs fm, check:release packs the kits – so the filter names them all.
      - name: Build
        run: pnpm turbo run build --filter='@fundamento/*' --cache-dir=.turbo/cache

      # AK-07 timings alone, in a job without a test run beside them (Spec 001 D-17).
      - name: Perf
        run: pnpm perf

      - name: Lint
        run: pnpm lint

      - name: "Check: Vortaro-Lint"
        run: pnpm check:vortaro-lint

      - name: "Check: Parity"
        run: pnpm check:parity

      - name: "Check: Regularo"
        run: pnpm check:regularo

      # Die Lücken, die das System von seinen Werkzeugen kennt (F41).
      - name: "Check: Mankoj"
        run: pnpm check:mankoj

      - name: "Check: Alirebleco"
        run: pnpm check:alirebleco

      # Spec 032 ②: with the fingerprints of every benchmark file in research/ (Carbon, Astryx),
      # read from the files themselves; no --spuroj needed.
      - name: "Check: Clean-Room"
        run: pnpm check:clean-room

      # Spec 014 ① (G3): every installed Aspekto draws every name of the Ikonaro.
      - name: "Check: Ikonaro"
        run: pnpm check:ikonaro

      # Spec 029 ① (Constitution v2.4): every value taken from a Fonto points at a pinned Fonto
      # with its licence text, its provenance matches the Aspekto, an adaptation names its Jugxo.
      - name: "Check: Fontoj"
        run: pnpm check:fontoj

      # Spec 036 Teil 5 ③ (Spec 029 ③): every Uzo has the documentation fields of its Vitrino
      # page – when-not, do-dont, keyboard – in German and English, none still the placeholder.
      - name: "Check: Dokumentaro"
        run: pnpm check:dokumentaro

      # Spec 036 Teil 6 (6.4, D-10): no versioned file names the word of R-12 or the private font
      # repository. The check scans `git ls-files` and knows both names only by hash; the verbatim
      # spec copies are its only exceptions, pinned by SHA-256.
      - name: "Check: Privat"
        run: pnpm check:privat

      # F23: the release path itself, on every PR — both kits built as release.yml builds them,
      # packed as a dry run. A broken release path turns red here, not in the maintainer's run.
      - name: "Check: Release"
        run: pnpm check:release

      # Spec 023 (§4.5, M-4): no byte of a licensed font in a public result — the projections,
      # the packages, the Make Kits. The CI knows no private repository; the step proves the path.
      - name: "Check: Tiparoj"
        run: pnpm check:tiparoj

  # Nachlese 9 (B-1): one runner per package. The five suites side by side on one runner were
  # about 20 processes on 4 vCPU, and a test spawning `fm` four times took 64 to 126 s there for
  # 8 s of work.
  unit:
    name: Unit tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [agordilo, cli, ekranoj, mcp, metiejo, modelo, nordstelo]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-

      # The package and its dependencies; `turbo run test` below builds what its test waits for
      # beyond them (turbo.json), from the same cache.
      - name: Build
        run: pnpm turbo run build --filter=@fundamento/${{ matrix.package }}... --cache-dir=.turbo/cache

      # A new package with tests joins the matrix above (workflow.test.ts says so); the Eroj have
      # the job eroj (W1), the Projekcioj the job projekcioj.
      # Spec 040 T-5: a pull request takes unchanged test results from the cache; main, the
      # nightly run and workflow_dispatch run every test (write only, never read: AC-B4, AC-B12).
      - name: Test
        run: pnpm turbo run test --filter=@fundamento/${{ matrix.package }} --cache-dir=.turbo/cache --cache=${{ github.event_name == 'pull_request' && 'local:rw' || 'local:w' }}

  projekcioj:
    name: Unit tests (Projekcioj, shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-

      - name: Build
        run: pnpm turbo run build --filter=@fundamento/projekcioj... --cache-dir=.turbo/cache

      # Every Celo test builds and validates the whole Modelo (seconds each, 258 s for the suite on
      # ten cores): this shard of the suite, sharded by Vitest over its files.
      # FM_GEBAUT: the Build step has built what the suite needs; Vitest does not build the whole
      # workspace again (packages/projekcioj/vitest.config.ts).
      - name: Test
        run: pnpm --filter @fundamento/projekcioj exec vitest run --shard=${{ matrix.shard }}/2
        env:
          FM_GEBAUT: "1"

  # Spec 040 B-6: on main, in three engines, the second of two shards ran into its 15 minutes (run
  # 41886235249: 15:17), the first ended at 12:56 and 13:02 (41886235249, 41873907893). Four
  # Playwright shards (fullyParallel: the cut goes through the tests, 474 of 1896 each on main);
  # the longest projects to ~10.4 min; three would leave the Firefox shard at 12.6 to 13.2 min.
  eroj:
    name: Rendered Eroj (Playwright, shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # A run on main (the merge run, the nightly run) proves the rendering of the Eroj in Chromium,
    # Firefox and WebKit (Spec 003); a PR run in Chromium only. An engine-specific defect therefore
    # shows on main, not in the PR. Read by packages/eroj/playwright.config.ts.
    env:
      PLAYWRIGHT_ENGINES: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && 'chromium firefox webkit' || 'chromium' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Spec 025 ③ (B-28): only the engines a run uses are installed — Chromium on a pull request,
      # all three on main. The time of this step is apt (`--with-deps`), not the browser download
      # (Vojmapo); on a cold runner the packages of three engines took 7 min (Läufe 39754200831,
      # 39754602800) and, with the Vitrino check of 40 Eroj, cut the rendered checks off at 15 min.
      # A cache of ~/.cache/ms-playwright was measured and taken back. workflow.test.ts pins this line.
      - name: Playwright browsers
        run: pnpm --filter @fundamento/eroj exec playwright install --with-deps $PLAYWRIGHT_ENGINES

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-

      # Spec 040 A-4: seven specs spawn the built fm, so the closure is the CLI's.
      - name: Build
        run: pnpm turbo run build --filter=@fundamento/cli... --cache-dir=.turbo/cache

      # The unit tests of the package (the React types, the parts of the Vitrino), then this shard
      # of the Playwright suite.
      - name: Test
        run: pnpm --filter @fundamento/eroj exec vitest run --passWithNoTests && pnpm --filter @fundamento/eroj exec playwright test --shard=${{ matrix.shard }}/4
        env:
          FM_GEBAUT: "1"

  # Nachlese 5 ① (D-04): the rendered checks ran 7:52 to 8:34 in one job (axe over the Eroj alone
  # 178 to 233 s, the Vitrino 104 to 140 s). axe over the Eroj is a job of its own; the Make Kit,
  # the quickstart and the Vitrino stay together. Measured in specs/018-nachlese-5/tasks.md ①.
  # Spec 040 B-1: on main, in three engines, the job ran into its 15 minutes (runs 41827472808,
  # 41842873743, 41886235249) or ended 21 s short of them (41873907893). Three Playwright shards
  # (fullyParallel); on main each shard is one engine, Firefox the longest: ~11 min of test time,
  # ~6 min on the two workers of a runner.
  alirebleco-eroj:
    name: Rendered accessibility (Alirebleco of the Eroj, shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      PLAYWRIGHT_ENGINES: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && 'chromium firefox webkit' || 'chromium' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright browsers
        run: pnpm --filter @fundamento/eroj exec playwright install --with-deps $PLAYWRIGHT_ENGINES

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-

      - name: Build
        run: pnpm turbo run build --filter=@fundamento/eroj... --cache-dir=.turbo/cache

      # Rendered accessibility of the Eroj: axe-core, keyboard, focus ring (Spec 003 T013, D-09).
      # No `--` before the shard: pnpm would pass it on, and Playwright reads what follows a `--`
      # as file filters.
      - name: "Check: Alirebleco (Eroj)"
        run: pnpm check:alirebleco-eroj --shard=${{ matrix.shard }}/3

  # Spec 040 B-1: the Werkstatt left this job for a job of its own (werkstatt).
  rendered-checks:
    name: Rendered checks (Make Kit, Quickstart)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_ENGINES: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && 'chromium firefox webkit' || 'chromium' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright browsers
        run: pnpm --filter @fundamento/eroj exec playwright install --with-deps $PLAYWRIGHT_ENGINES

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-

      - name: Build
        run: pnpm turbo run build --filter=@fundamento/eroj... --cache-dir=.turbo/cache

      # AK-08: the Make Kit installs from its tarball and builds in a fresh project (T019).
      - name: "Check: Make Kit"
        run: pnpm check:make-kit

      # AK-07: the quickstart of the README, run as a user would and timed (T027).
      - name: "Check: Quickstart"
        run: pnpm check:quickstart

  # Spec 040 B-1: the Werkstatt of the Vitrino, in parts of packages/eroj/test/vitrino-partoj.ts.
  # Beside the Make Kit and the quickstart it ran into the 15 minutes (run 41877598624); its tests
  # alone took up to ~13 min on a slow runner. The Vitrino runs in one engine (Chromium) on main
  # too; every part builds its projections and runs check:bazo on its own runner.
  werkstatt:
    name: Rendered checks (Vitrino-Werkstatt, part ${{ matrix.parto }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        parto: [werkstatt-1, werkstatt-2]
    env:
      PLAYWRIGHT_ENGINES: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && 'chromium firefox webkit' || 'chromium' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright browsers
        run: pnpm --filter @fundamento/eroj exec playwright install --with-deps $PLAYWRIGHT_ENGINES

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-

      # check:bazo spawns the built fm: the closure is the CLI's.
      - name: Build
        run: pnpm turbo run build --filter=@fundamento/cli... --cache-dir=.turbo/cache

      # Spec 004 AK-02, Spec 016 ②, Spec 019 ②: the Werkstatt of the Vitrino in a browser.
      - name: "Check: Vitrino (Werkstatt)"
        run: pnpm check:vitrino
        env:
          VITRINO_PARTO: ${{ matrix.parto }}

  # Spec 029 ①b (B-1b-6): the Vitrino without its Werkstatt, a job of its own – with the Make Kit
  # and the quickstart it ran past 15 minutes on a slow runner.
  # Spec 040 B-1: alone it ran into its 15 minutes too (runs 41873907893, 41864293712,
  # 41877598624, 41886235249: ~21 min of tests on a slow runner, Chromium only). Three parts of
  # packages/eroj/test/vitrino-partoj.ts, a runner each.
  vitrino:
    name: Rendered checks (Vitrino, part ${{ matrix.parto }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        parto: [cetero-1, cetero-2, cetero-3]
    env:
      PLAYWRIGHT_ENGINES: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && 'chromium firefox webkit' || 'chromium' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright browsers
        run: pnpm --filter @fundamento/eroj exec playwright install --with-deps $PLAYWRIGHT_ENGINES

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-

      # check:bazo spawns the built fm: the closure is the CLI's.
      - name: Build
        run: pnpm turbo run build --filter=@fundamento/cli... --cache-dir=.turbo/cache

      # Spec 004 AK-02: the Vitrino in a browser — switching, comparison, axe (T011, T012).
      - name: "Check: Vitrino"
        run: pnpm check:vitrino
        env:
          VITRINO_PARTO: ${{ matrix.parto }}
