name: CI

# A branch is checked by its pull request; a push runs CI only on main (the merge run). Before,
# every commit of a PR ran twice, once per event (Vojmapo, 37442271925 and 37442276408).
# That double run was also the only repetition on one tree, and it showed the hook timeout in
# ak09-dialog.test.ts (red in the push run, green in the PR run). The nightly full run on main keeps
# a repetition without doubling every commit; workflow_dispatch repeats a tree on demand.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# No network beyond `pnpm install`: keep Turborepo telemetry off.
env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

# The event is part of the group: the nightly run and a merge run share refs/heads/main and must not
# cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, test, lint and conformance checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A run on main (the merge run, the nightly run) proves the rendering of the Eroj in Chromium,
    # Firefox and WebKit (Spec 003); a PR run in Chromium only. "Check: Alirebleco (Eroj)" took 201 to 205 s of
    # 734 to 805 s in three engines (Vojmapo). An engine-specific defect therefore shows on main,
    # not in the PR. Read by packages/eroj/playwright.config.ts.
    env:
      # MESSUNG Strang D, geht vor dem Merge wieder weg: alle drei Engines auch im PR-Lauf.
      PLAYWRIGHT_ENGINES: chromium firefox webkit
    steps:
      # Default fetch depth (1) is enough: the checks only need `git ls-files`.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm version comes from `packageManager` in package.json; no `version` input.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # pnpm must be installed first so setup-node can resolve the pnpm store for caching.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # All three engines are installed in every run, also where PLAYWRIGHT_ENGINES runs only one:
      # workflow.test.ts pins this line. Strang D (Vojmapo): without --with-deps. The time of the
      # step was apt, 115 MB at times at 178 to 240 kB/s, not the browser download; measured here
      # whether ubuntu-latest already brings the system libraries the engines need.
      - name: Playwright browsers
        run: pnpm --filter @fundamento/eroj exec playwright install chromium firefox webkit

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # AK-07 timings alone, after the parallel test run (Spec 001 D-17).
      - name: Perf
        run: pnpm perf

      - name: Lint
        run: pnpm lint

      - name: "Check: Vortaro-Lint"
        run: pnpm check:vortaro-lint

      - name: "Check: Parity"
        run: pnpm check:parity

      - name: "Check: Regularo"
        run: pnpm check:regularo

      # Die Lücken, die das System von seinen Werkzeugen kennt (F41).
      - name: "Check: Mankoj"
        run: pnpm check:mankoj

      - name: "Check: Alirebleco"
        run: pnpm check:alirebleco

      - name: "Check: Clean-Room"
        run: pnpm check:clean-room

      # Rendered accessibility of the Eroj: axe-core, keyboard, focus ring (Spec 003 T013, D-09).
      - name: "Check: Alirebleco (Eroj)"
        run: pnpm check:alirebleco-eroj

      # AK-08: the Make Kit installs from its tarball and builds in a fresh project (T019).
      - name: "Check: Make Kit"
        run: pnpm check:make-kit


      # AK-07: the quickstart of the README, run as a user would and timed (T027).
      - name: "Check: Quickstart"
        run: pnpm check:quickstart

      # Spec 004 AK-02: the Vitrino in a browser — switching, comparison, axe (T011, T012).
      - name: "Check: Vitrino"
        run: pnpm check:vitrino

      # F23: the release path itself, on every PR — both kits built as release.yml builds them,
      # packed as a dry run. A broken release path turns red here, not in the maintainer's run.
      - name: "Check: Release"
        run: pnpm check:release

      # Strang D, Messung: the apt that --with-deps ran, last, so no check above sees its libraries.
      # Its log carries "Need to get …" and "Fetched … in … (… kB/s)". Goes once it is read.
      - name: "Messung: apt (playwright install-deps)"
        run: pnpm --filter @fundamento/eroj exec playwright install-deps chromium firefox webkit
