        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$PLAYWRIGHT_CACHE_HIT" != "true" ]; then
            pnpm --filter @fundamento/eroj exec playwright install --with-deps chromium
            mkdir -p ~/.cache/playwright-apt
            find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/.cache/playwright-apt {} +
            exit 0
          fi
          pnpm --filter @fundamento/eroj exec playwright install chromium
          if report=$(pnpm --filter @fundamento/eroj exec playwright install-deps --dry-run chromium); then
            exit 0
          fi
          printf '%s\n' "$report"
          missing=$(printf '%s\n' "$report" | sed -n 's/^  \([a-z0-9][a-z0-9.+-]*\)$/\1/p')
          debs=$(for package in $missing; do find ~/.cache/playwright-apt -maxdepth 1 -name "${package}_*.deb"; done)
          if [ -n "$missing" ] && [ "$(echo "$debs" | wc -l)" = "$(echo "$missing" | wc -l)" ] && sudo dpkg -i $debs && pnpm --filter @fundamento/eroj exec playwright install-deps --dry-run chromium; then
            exit 0
          fi
          echo "::warning title=Playwright cache::the cached apt packages do not cover the system dependencies; installing them from the mirror"
          pnpm --filter @fundamento/eroj exec playwright install-deps chromium

      - name: Save Playwright cache
        if: ${{ (needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj')) && steps.playwright-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: ${{ steps.playwright-key.outputs.key }}

      - name: Turbo cache
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-

      # check:bazo spawns the built fm: the closure is the CLI's.
      - name: Build
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        run: pnpm turbo run build --filter=@fundamento/cli... --cache-dir=.turbo/cache

      # Spec 004 AK-02: the Vitrino in a browser — switching, comparison, axe (T011, T012).
      - name: "Check: Vitrino"
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        run: pnpm check:vitrino
        env:
          VITRINO_PARTO: ${{ matrix.parto }}

      # Spec 040 T-7 (AC-B10, E-13): the full reports of the job – JUnit, in Playwright also the HTML
      # report – after a red step too, but only where the job tested; no environment, seven days.
      - name: Testberichte
        if: ${{ always() && (needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj')) }}
        uses: actions/upload-artifact@v7
        with:
          name: testberichte-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ github.run_attempt }}
          path: packages/*/test-reports/
          retention-days: 7
          if-no-files-found: ignore

  # Spec 040 T-7 (AC-B6): the timing tests of the Vitrino – M5 with its Gegenproben and the
  # calibration of the block, the Ableitung Gegenprobe, G5 and its Gegenprobe – in a job of their
  # own, the part `zeittests` of packages/eroj/test/vitrino-partoj.ts; the Werkstatt parts leave
  # them out. Their limits and calibration are unchanged. Red here does not block a pull request
  # (it shows as failed, the run stays green); on main, at night and on workflow_dispatch it blocks.
  zeittests:
    name: Timing checks (M5, Gegenprobe, Ableitung, G5)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    needs: betroffen
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Spec 040 T-6 (E-9): no change reaches this job's package – it ends green and says so.
      - name: nicht betroffen
        if: ${{ !(needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj')) }}
        run: 'echo "nicht betroffen: no change reaches @fundamento/eroj, this job tests nothing." | tee -a "$GITHUB_STEP_SUMMARY"'

      - name: Set up pnpm
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        uses: pnpm/action-setup@v6

      - name: Set up Node
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        run: pnpm install --frozen-lockfile

      # Spec 040 D-19: playwright.vitrino.config.ts runs the first project of the shared config alone,
      # Chromium, whatever PLAYWRIGHT_ENGINES names – so Chromium alone is installed, and the job
      # carries no PLAYWRIGHT_ENGINES. The apt packages of three engines cut four jobs off at 15 min
      # in this step on a slow mirror (PR #145). Spec 041 I-1: the browsers and their apt packages
      # come from the Actions cache as in the job eroj; workflow.test.ts pins these four steps.
      - name: Playwright cache key
        id: playwright-key
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        run: echo "key=playwright-$RUNNER_OS-$RUNNER_ARCH-$ImageOS-$ImageVersion-$(node -p "require('./packages/eroj/node_modules/@playwright/test/package.json').version")-$(echo chromium | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright cache
        id: playwright-cache
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: ${{ steps.playwright-key.outputs.key }}

      - name: Playwright browsers
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$PLAYWRIGHT_CACHE_HIT" != "true" ]; then
            pnpm --filter @fundamento/eroj exec playwright install --with-deps chromium
            mkdir -p ~/.cache/playwright-apt
            find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/.cache/playwright-apt {} +
            exit 0
          fi
          pnpm --filter @fundamento/eroj exec playwright install chromium
          if report=$(pnpm --filter @fundamento/eroj exec playwright install-deps --dry-run chromium); then
            exit 0
          fi
          printf '%s\n' "$report"
          missing=$(printf '%s\n' "$report" | sed -n 's/^  \([a-z0-9][a-z0-9.+-]*\)$/\1/p')
          debs=$(for package in $missing; do find ~/.cache/playwright-apt -maxdepth 1 -name "${package}_*.deb"; done)
          if [ -n "$missing" ] && [ "$(echo "$debs" | wc -l)" = "$(echo "$missing" | wc -l)" ] && sudo dpkg -i $debs && pnpm --filter @fundamento/eroj exec playwright install-deps --dry-run chromium; then
            exit 0
          fi
          echo "::warning title=Playwright cache::the cached apt packages do not cover the system dependencies; installing them from the mirror"
          pnpm --filter @fundamento/eroj exec playwright install-deps chromium

      - name: Save Playwright cache
        if: ${{ (needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj')) && steps.playwright-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: ${{ steps.playwright-key.outputs.key }}

      - name: Turbo cache
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-

      # check:bazo spawns the built fm: the closure is the CLI's.
      - name: Build
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        run: pnpm turbo run build --filter=@fundamento/cli... --cache-dir=.turbo/cache

      # Spec 019 ② (M5, G5), Nachlese 12 ③, Spec 035/036 (Gegenproben, Ableitung): the timings of
      # the Werkstatt in a browser, as before in the Werkstatt parts.
      - name: "Check: Vitrino (Zeittests)"
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        run: pnpm check:vitrino
        env:
          VITRINO_PARTO: zeittests

      # Spec 040 T-7 (AC-B10, E-13): the full reports of the job – JUnit, in Playwright also the HTML
      # report – after a red step too, but only where the job tested; no environment, seven days.
      - name: Testberichte
        if: ${{ always() && (needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj')) }}
        uses: actions/upload-artifact@v7
        with:
          name: testberichte-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ github.run_attempt }}
          path: packages/*/test-reports/
          retention-days: 7
          if-no-files-found: ignore
