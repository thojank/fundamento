      - name: Set up Node
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

