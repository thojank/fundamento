name: CI

# A branch is checked by its pull request; a push runs CI only on main (the merge run). Before,
# every commit of a PR ran twice, once per event (Vojmapo, 37442271925 and 37442276408).
# That double run was also the only repetition on one tree, and it showed the hook timeout in
# ak09-dialog.test.ts (red in the push run, green in the PR run). The nightly full run on main keeps
# a repetition without doubling every commit; workflow_dispatch repeats a tree on demand.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# No network beyond `pnpm install`: keep Turborepo telemetry off.
# Spec 040 T-7 (C-4, AC-B10): the reporters of scripts/reporter/ print only the red tests, each with
# its first error, and one summary line naming the full report; the full reports (JUnit, Playwright's
# HTML report) are the artifact "testberichte-…" of every test job. Where Turborepo runs tests it
# shows the logs of failed tasks only (--output-logs=errors-only).
env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  FM_AUSGABE: knapp

# Spec 040 T-5: every job keeps the local Turborepo cache (.turbo/cache) between runs, one cache
# per job and matrix value, and builds only what its steps need (`turbo run build --filter`). The
# key ends on the commit, so every run saves; a run restores the newest cache of its job through
# the prefix of lockfile, turbo.json and Node. Turborepo hashes the inputs of every task itself
# (turbo.json, packages/modelo/src/ci/turbo-inputs.test.ts): a hit replays only what is unchanged.
# No remote cache, no token.

# The event is part of the group: the nightly run and a merge run share refs/heads/main and must not
# cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Spec 040 T-6 (C-2, US-2, B-3): which packages a change reaches, decided once per run. A pull
  # request tests only those (the packages it changes and every package that depends on them, from
  # the graph of Turborepo, plus a package whose test reads a changed file from outside it, from
  # turbo.json); a changed root file (lockfile, turbo.json, workflows, scripts/ …) or an unknown
  # merge base tests everything (E-7, E-8). main, the nightly run and workflow_dispatch test
  # everything in every engine (AC-B4). The other jobs read the three outputs step by step: every
  # job still runs and reports its check, and one without a change ends green with "nicht
  # betroffen" (E-9). The checks are repo-wide and always run.
  betroffen:
    name: Affected packages (betroffen)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pakete: ${{ steps.betroffen.outputs.pakete }}
      alle: ${{ steps.betroffen.outputs.alle }}
      engines: ${{ steps.betroffen.outputs.engines }}
    steps:
      # The whole history: the merge base with the base branch of the pull request.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Turborepo reads the package graph.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Affected packages
        id: betroffen
        run: node scripts/ci/betroffen.mjs

  # Nachlese 3 W1 (Spec 011 ⑤ B-9, O-21 fortgesetzt): three jobs side by side instead of one row.
  # The one job ran the Playwright suite of the Eroj beside the spawning e2e files of modelo
  # (turbo runs the packages' tests in parallel): the hook of validate.test.ts timed out under
  # that load (run 38966614433), and the wall clock stood at 16 to 19 minutes. Measured
  # before/after in specs/012-nachlese-3/plan.md ②.
  #
  # Spec 015 ② (O-4 of plan ①, B-12): the job of the unit tests grew with every Ero past the
  # 12-minute line (run 39126240312: 12 min 07 s, its Test step 10 min 24 s; the Projekcioj suite
  # took 622 s of it beside modelo, cli and mcp on the four cores of the runner). It is cut in
  # three: the checks (build, perf, lint, the Modelo checks, release — about two minutes), the
  # unit tests of every package but Projekcioj and Eroj, and the Projekcioj suite in two Vitest
  # shards, the cut the Eroj got with W1. Measured before/after in specs/015-eroj-runde-4/plan.md ②.
  checks:
    name: Build, lint and Modelo checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Default fetch depth (1) is enough: the checks only need `git ls-files`.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm version comes from `packageManager` in package.json; no `version` input.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # pnpm must be installed first so setup-node can resolve the pnpm store for caching.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-

      # Spec 040 T-5 (A-5): the checks need every package – lint builds the dependencies of each,
      # check:parity runs fm, check:release packs the kits – so the filter names them all.
      - name: Build
        run: pnpm turbo run build --filter='@fundamento/*' --cache-dir=.turbo/cache

      # AK-07 timings alone, in a job without a test run beside them (Spec 001 D-17).
      - name: Perf
        run: pnpm perf

      - name: Lint
        run: pnpm lint

      - name: "Check: Vortaro-Lint"
        run: pnpm check:vortaro-lint

      - name: "Check: Parity"
        run: pnpm check:parity

      - name: "Check: Regularo"
        run: pnpm check:regularo

      # Die Lücken, die das System von seinen Werkzeugen kennt (F41).
      - name: "Check: Mankoj"
        run: pnpm check:mankoj

      - name: "Check: Alirebleco"
        run: pnpm check:alirebleco

      # Spec 032 ②: with the fingerprints of every benchmark file in research/ (Carbon, Astryx),
      # read from the files themselves; no --spuroj needed.
      - name: "Check: Clean-Room"
        run: pnpm check:clean-room

      # Spec 014 ① (G3): every installed Aspekto draws every name of the Ikonaro.
      - name: "Check: Ikonaro"
        run: pnpm check:ikonaro

      # Spec 029 ① (Constitution v2.4): every value taken from a Fonto points at a pinned Fonto
      # with its licence text, its provenance matches the Aspekto, an adaptation names its Jugxo.
      - name: "Check: Fontoj"
        run: pnpm check:fontoj

      # Spec 036 Teil 5 ③ (Spec 029 ③): every Uzo has the documentation fields of its Vitrino
      # page – when-not, do-dont, keyboard – in German and English, none still the placeholder.
      - name: "Check: Dokumentaro"
        run: pnpm check:dokumentaro

      # Spec 036 Teil 6 (6.4, D-10): no versioned file names the word of R-12 or the private font
      # repository. The check scans `git ls-files` and knows both names only by hash; the verbatim
      # spec copies are its only exceptions, pinned by SHA-256.
      - name: "Check: Privat"
        run: pnpm check:privat

      # F23: the release path itself, on every PR — both kits built as release.yml builds them,
      # packed as a dry run. A broken release path turns red here, not in the maintainer's run.
      - name: "Check: Release"
        run: pnpm check:release

      # Spec 023 (§4.5, M-4): no byte of a licensed font in a public result — the projections,
      # the packages, the Make Kits. The CI knows no private repository; the step proves the path.
      - name: "Check: Tiparoj"
        run: pnpm check:tiparoj

  # Nachlese 9 (B-1): one runner per package. The five suites side by side on one runner were
  # about 20 processes on 4 vCPU, and a test spawning `fm` four times took 64 to 126 s there for
  # 8 s of work.
  unit:
    name: Unit tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: betroffen
    strategy:
      fail-fast: false
      matrix:
        package: [agordilo, cli, ekranoj, mcp, metiejo, modelo, nordstelo]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Spec 040 T-6 (E-9): no change reaches this job's package – it ends green and says so.
      - name: nicht betroffen
        if: ${{ !(needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), format('@fundamento/{0}', matrix.package))) }}
        run: 'echo "nicht betroffen: no change reaches @fundamento/${{ matrix.package }}, this job tests nothing." | tee -a "$GITHUB_STEP_SUMMARY"'

      - name: Set up pnpm
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), format('@fundamento/{0}', matrix.package)) }}
        uses: pnpm/action-setup@v6

      - name: Set up Node
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), format('@fundamento/{0}', matrix.package)) }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), format('@fundamento/{0}', matrix.package)) }}
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), format('@fundamento/{0}', matrix.package)) }}
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-

      # The package and its dependencies; `turbo run test` below builds what its test waits for
      # beyond them (turbo.json), from the same cache.
      - name: Build
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), format('@fundamento/{0}', matrix.package)) }}
        run: pnpm turbo run build --filter=@fundamento/${{ matrix.package }}... --cache-dir=.turbo/cache

      # A new package with tests joins the matrix above (workflow.test.ts says so); the Eroj have
      # the job eroj (W1), the Projekcioj the job projekcioj.
      # Spec 040 T-5: a pull request takes unchanged test results from the cache; main, the
      # nightly run and workflow_dispatch run every test (write only, never read: AC-B4, AC-B12).
      - name: Test
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), format('@fundamento/{0}', matrix.package)) }}
        run: pnpm turbo run test --filter=@fundamento/${{ matrix.package }} --cache-dir=.turbo/cache --cache=${{ github.event_name == 'pull_request' && 'local:rw' || 'local:w' }} --output-logs=errors-only

      # Spec 040 T-7 (AC-B10, E-13): the full reports of the job – JUnit, in Playwright also the HTML
      # report – after a red step too, but only where the job tested; no environment, seven days.
      - name: Testberichte
        if: ${{ always() && (needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), format('@fundamento/{0}', matrix.package))) }}
        uses: actions/upload-artifact@v7
        with:
          name: testberichte-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ github.run_attempt }}
          path: packages/*/test-reports/
          retention-days: 7
          if-no-files-found: ignore

  projekcioj:
    name: Unit tests (Projekcioj, shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: betroffen
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Spec 040 T-6 (E-9): no change reaches this job's package – it ends green and says so.
      - name: nicht betroffen
        if: ${{ !(needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/projekcioj')) }}
        run: 'echo "nicht betroffen: no change reaches @fundamento/projekcioj, this job tests nothing." | tee -a "$GITHUB_STEP_SUMMARY"'

      - name: Set up pnpm
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/projekcioj') }}
        uses: pnpm/action-setup@v6

      - name: Set up Node
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/projekcioj') }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/projekcioj') }}
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/projekcioj') }}
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-

      - name: Build
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/projekcioj') }}
        run: pnpm turbo run build --filter=@fundamento/projekcioj... --cache-dir=.turbo/cache

      # Every Celo test builds and validates the whole Modelo (seconds each, 258 s for the suite on
      # ten cores): this shard of the suite, sharded by Vitest over its files.
      # FM_GEBAUT: the Build step has built what the suite needs; Vitest does not build the whole
      # workspace again (packages/projekcioj/vitest.config.ts).
      - name: Test
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/projekcioj') }}
        run: pnpm --filter @fundamento/projekcioj exec vitest run --shard=${{ matrix.shard }}/2
        env:
          FM_GEBAUT: "1"

      # Spec 040 T-7 (AC-B10, E-13): the full reports of the job – JUnit, in Playwright also the HTML
      # report – after a red step too, but only where the job tested; no environment, seven days.
      - name: Testberichte
        if: ${{ always() && (needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/projekcioj')) }}
        uses: actions/upload-artifact@v7
        with:
          name: testberichte-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ github.run_attempt }}
          path: packages/*/test-reports/
          retention-days: 7
          if-no-files-found: ignore

  # Spec 040 B-6: on main, in three engines, the second of two shards ran into its 15 minutes (run
  # 41886235249: 15:17), the first ended at 12:56 and 13:02 (41886235249, 41873907893). Four
  # Playwright shards (fullyParallel: the cut goes through the tests, 474 of 1896 each on main);
  # the longest projects to ~10.4 min; three would leave the Firefox shard at 12.6 to 13.2 min.
  eroj:
    name: Rendered Eroj (Playwright, shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: betroffen
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # A run on main (the merge run, the nightly run, workflow_dispatch) proves the rendering of the
    # Eroj in Chromium, Firefox and WebKit (Spec 003). Spec 040 B-3 (V-8): a pull request runs all
    # three too when it changes the Eroj, the Projekcioj, the Vortaro, an Aspekto or a Playwright
    # config, otherwise Chromium only – an engine-specific defect shows in the PR that causes it.
    # betroffen decides it (scripts/ci/betroffen.mjs); read by packages/eroj/playwright.config.ts.
    env:
      PLAYWRIGHT_ENGINES: ${{ needs.betroffen.outputs.engines }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Spec 040 T-6 (E-9): no change reaches this job's package – it ends green and says so.
      - name: nicht betroffen
        if: ${{ !(needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj')) }}
        run: 'echo "nicht betroffen: no change reaches @fundamento/eroj, this job tests nothing." | tee -a "$GITHUB_STEP_SUMMARY"'

      - name: Set up pnpm
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        uses: pnpm/action-setup@v6

      - name: Set up Node
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        run: pnpm install --frozen-lockfile

      # Spec 025 ③ (B-28): only the engines a run uses are installed — the ones betroffen chose
      # (Spec 040 B-3), Chromium alone on most pull requests. The time of this step is apt (`--with-deps`), not the browser download
      # (Vojmapo); on a cold runner the packages of three engines took 7 min (Läufe 39754200831,
      # 39754602800) and, with the Vitrino check of 40 Eroj, cut the rendered checks off at 15 min.
      # Spec 041 I-1: a slow Ubuntu mirror cut seven jobs off at 15 min in this step (runs
      # 41920898257, 41931882770, 41936625983; 41943148273: "Fetched 114 MB in 13min 37s (140 kB/s)").
      # A cache of ~/.cache/ms-playwright alone did not help (Spec 040 D-06): the browsers and the
      # .deb files that `--with-deps` fetched live in the Actions cache together, keyed by the
      # installed Playwright version, the runner OS, architecture and image (ImageOS, ImageVersion:
      # the .deb files fit the packages of that image) and the engines of the job. A miss runs the
      # line of today and keeps the .deb files; the cache is saved right after a green install, so a
      # red test later does not lose it. A hit downloads no browser and runs no apt at all:
      # `install-deps --dry-run` names the system packages that are missing, and exactly those are
      # installed from their cached .deb files with dpkg – all of them or none. (`apt-get install
      # --no-download ./x.deb` takes a package of the version in the image's lists from the
      # repository and refuses: run 42050500562.) The mirror comes back only, after a warning, when
      # the cache does not cover the system. A restore that fails is a miss, never a red job.
      # workflow.test.ts pins these four steps in every job that installs browsers.
      - name: Playwright cache key
        id: playwright-key
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        run: echo "key=playwright-$RUNNER_OS-$RUNNER_ARCH-$ImageOS-$ImageVersion-$(node -p "require('./packages/eroj/node_modules/@playwright/test/package.json').version")-$(echo $PLAYWRIGHT_ENGINES | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright cache
        id: playwright-cache
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: ${{ steps.playwright-key.outputs.key }}

      - name: Playwright browsers
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$PLAYWRIGHT_CACHE_HIT" != "true" ]; then
            pnpm --filter @fundamento/eroj exec playwright install --with-deps $PLAYWRIGHT_ENGINES
            mkdir -p ~/.cache/playwright-apt
            find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/.cache/playwright-apt {} +
            exit 0
          fi
          pnpm --filter @fundamento/eroj exec playwright install $PLAYWRIGHT_ENGINES
          if report=$(pnpm --filter @fundamento/eroj exec playwright install-deps --dry-run $PLAYWRIGHT_ENGINES); then
            exit 0
          fi
          printf '%s\n' "$report"
          missing=$(printf '%s\n' "$report" | sed -n 's/^  \([a-z0-9][a-z0-9.+-]*\)$/\1/p')
          debs=$(for package in $missing; do find ~/.cache/playwright-apt -maxdepth 1 -name "${package}_*.deb"; done)
          if [ -n "$missing" ] && [ "$(echo "$debs" | wc -l)" = "$(echo "$missing" | wc -l)" ] && sudo dpkg -i $debs && pnpm --filter @fundamento/eroj exec playwright install-deps --dry-run $PLAYWRIGHT_ENGINES; then
            exit 0
          fi
          echo "::warning title=Playwright cache::the cached apt packages do not cover the system dependencies; installing them from the mirror"
          pnpm --filter @fundamento/eroj exec playwright install-deps $PLAYWRIGHT_ENGINES

      - name: Save Playwright cache
        if: ${{ (needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj')) && steps.playwright-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: ${{ steps.playwright-key.outputs.key }}

      - name: Turbo cache
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ matrix.package || matrix.shard || matrix.parto || 'x' }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.nvmrc') }}-

      # Spec 040 A-4: seven specs spawn the built fm, so the closure is the CLI's.
      - name: Build
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        run: pnpm turbo run build --filter=@fundamento/cli... --cache-dir=.turbo/cache

      # The unit tests of the package (the React types, the parts of the Vitrino), then this shard
      # of the Playwright suite.
      - name: Test
        if: ${{ needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj') }}
        run: pnpm --filter @fundamento/eroj exec vitest run --passWithNoTests && pnpm --filter @fundamento/eroj exec playwright test --shard=${{ matrix.shard }}/4
        env:
          FM_GEBAUT: "1"

      # Spec 040 T-7 (AC-B10, E-13): the full reports of the job – JUnit, in Playwright also the HTML
      # report – after a red step too, but only where the job tested; no environment, seven days.
      - name: Testberichte
        if: ${{ always() && (needs.betroffen.outputs.alle == 'true' || contains(fromJSON(needs.betroffen.outputs.pakete), '@fundamento/eroj')) }}
