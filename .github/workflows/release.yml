# Release path of the Figma Make kits (Spec 003, T020, maintainer decision Q2; release step F25).
#
# Two modes, chosen by the maintainer on demand: `dry-run` (default) builds the kits and runs
# `pnpm publish --dry-run`, so the contents of a release can be reviewed before anything leaves
# the repository; `publish` releases both kits under the dist-tag `next` with provenance — only
# from main. Both go through npm Trusted Publishing: the registry trusts this repository and this
# workflow file (OIDC), so no publish token, no secret and no auth entry in .npmrc exists anywhere
# in this repository. The pre-release number is an input (F25): 0.1.0-next.1 is the next one.
name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run shows what a publish would contain; publish releases (main only)"
        type: choice
        options:
          - dry-run
          - publish
        default: dry-run
      version:
        description: "The pre-release number of the kits, a pre-release of the Modelo's version (e.g. 0.1.0-next.1)"
        type: string
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  dry-run:
    name: Build the Make kits and show what a publish would contain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # pnpm hands the publish and the OIDC exchange to the npm CLI, which needs npm >= 11.5.1 for
      # Trusted Publishing (research §7). Without it npm would silently look for a token.
      - name: Check the npm version
        run: |
          required=11.5.1
          installed=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$required" "$installed" | sort -V | head -1)" != "$required" ]; then
            echo "npm $installed is older than $required, which npm Trusted Publishing needs." >&2
            exit 1
          fi
          echo "npm $installed is new enough for Trusted Publishing."

      # One script for the release path and for the CI (F23): it builds both kits — komuna from the
      # repository, ekzemplo from its fixture —, checks that each exists and carries no font file,
      # and runs the command of the mode in every kit.
      - name: Build both kits and show what a publish would contain
        if: inputs.mode == 'dry-run'
        run: scripts/release-kits.sh dry-run
        env:
          FUNDAMENTO_KIT_VERSION: ${{ inputs.version }}

      # The release itself: only when the maintainer chose it, only from main. Provenance ties the
      # packages to this workflow run; the version is the input above, written into every kit.
      - name: Build both kits and publish them under the tag next
        if: inputs.mode == 'publish' && github.ref == 'refs/heads/main'
        run: scripts/release-kits.sh publish
        env:
          FUNDAMENTO_KIT_VERSION: ${{ inputs.version }}
