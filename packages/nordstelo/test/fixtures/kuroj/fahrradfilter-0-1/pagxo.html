<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fahrradfilter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            background-color: #f9f9f9;
        }
        form {
            background: #fff;
            padding: 1.5rem;
            border-radius: 8px;
            max-width: 400px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        fieldset {
            border: none;
            margin-bottom: 1rem;
        }
        legend {
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.3rem;
            cursor: pointer;
        }
        input[type="number"] {
            width: 100px;
            padding: 0.3rem;
            margin-right: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        select {
            width: 100%;
            padding: 0.4rem;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <form id="bike-filter" aria-label="Filter für Fahrräder">
        <fieldset>
            <legend>Preisbereich</legend>
            <label for="price-min">Min. Preis (€):</label>
            <input type="number" id="price-min" name="price-min" min="0" step="1" placeholder="0" />
            <label for="price-max">Max. Preis (€):</label>
            <input type="number" id="price-max" name="price-max" min="0" step="1" placeholder="9999" />
        </fieldset>
        <fieldset>
            <legend>Kategorie</legend>
            <select id="category" name="category" aria-label="Kategorie auswählen">
                <option value="">Alle Kategorien</option>
                <option value="mountainbike">Mountainbike</option>
                <option value="rennrad">Rennrad</option>
                <option value="citybike">Citybike</option>
                <option value="elektrofahrrad">Elektrofahrrad</option>
                <option value="faltrad">Faltrad</option>
                <option value="tourenrad">Tourenrad</option>
                <option value="kinderfahrrad">Kinderfahrrad</option>
            </select>
        </fieldset>
        <button type="submit">Filtern</button>
    </form>
</body>
</html>
