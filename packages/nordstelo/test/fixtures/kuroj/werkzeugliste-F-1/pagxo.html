<fm-listelektilo name="status-filter" placeholder="Status filtern">
  <span slot="label">Status</span>
  <fm-listitem slot="options" value="danger" style="background: var(--color-status-danger-basic); color: var(--color-status-danger-on);">Gefahr</fm-listitem>
  <fm-listitem slot="options" value="info" style="background: var(--color-status-info-basic); color: var(--color-status-info-on);">Info</fm-listitem>
  <fm-listitem slot="options" value="success" style="background: var(--color-status-success-basic); color: var(--color-status-success-on);">Erfolg</fm-listitem>
  <fm-listitem slot="options" value="warning" style="background: var(--color-status-warning-basic); color: var(--color-status-warning-on);">Warnung</fm-listitem>
</fm-listelektilo>

<fm-kompletigilo name="search" placeholder="Suchen">
  <span slot="label">Suche</span>
</fm-kompletigilo>
